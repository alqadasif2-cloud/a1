name: Build Android APK (A«»M)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

permissions:
  contents: write

jobs:
  build-apk:
    name: 📱 Build A«»M Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Node Dependencies
        run: |
          npm ci || npm install

      - name: 🌐 Build Vite Web Assets
        run: |
          npm run build

      - name: 🔄 Sync Capacitor Android Platform
        run: |
          npx cap sync android

      - name: 🔑 Grant Executable Permission to Gradle Wrapper
        run: |
          chmod +x android/gradlew

      - name: 🔨 Build Android Debug APK
        if: "${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name != 'workflow_dispatch' }}"
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 🔨 Build Android Release APK (Unsigned)
        if: "${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}"
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: 📤 Upload Debug APK Artifact
        if: "${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name != 'workflow_dispatch' }}"
        uses: actions/upload-artifact@v4
        with:
          name: AM-A«»M-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload Release APK Artifact
        if: "${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}"
        uses: actions/upload-artifact@v4
        with:
          name: AM-A«»M-app-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
          retention-days: 30
