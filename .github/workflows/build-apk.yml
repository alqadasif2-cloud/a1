name: Build Android APK (A«»M)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

permissions:
  contents: write

jobs:
  build-apk:
    name: 📱 Build A«»M Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🟢 Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🤖 Setup Android SDK & Accept Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: 📦 Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 🌐 Build Vite Web Assets
        run: |
          npm run build

      - name: 🔄 Ensure Android Platform & Gradle Wrapper
        run: |
          # 1. Check if android platform exists; if not, add it on the fly
          if [ ! -d "android" ]; then
            echo "⚡ android/ folder not found. Adding Android platform via Capacitor..."
            npx cap add android
          else
            echo "⚡ android/ folder exists. Syncing web assets and plugins..."
            npx cap sync android
          fi

          # 2. Configure Android SDK path in local.properties
          if [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          elif [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          fi

          # 3. Ensure gradlew exists, or generate wrapper if missing
          if [ ! -f "android/gradlew" ]; then
            echo "⚡ android/gradlew not found, generating wrapper with Gradle..."
            cd android
            gradle wrapper || true
            cd ..
          fi

          # 4. Grant executable permissions
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

          # 5. Inject media and call permissions if needed
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "RECORD_AUDIO" "$MANIFEST"; then
            echo "Injecting media and call permissions into AndroidManifest.xml..."
            sed -i '/<\/application>/a \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST"
          fi

      - name: 🔨 Build Android Debug APK
        if: "${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name != 'workflow_dispatch' }}"
        run: |
          cd android
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            echo "⚡ ./gradlew not found, building directly using system Gradle..."
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: 🔨 Build Android Release APK (Unsigned)
        if: "${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}"
        run: |
          cd android
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace --no-daemon
          else
            echo "⚡ ./gradlew not found, building release directly using system Gradle..."
            gradle assembleRelease --stacktrace --no-daemon
          fi

      - name: 📤 Upload Debug APK Artifact
        if: "${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name != 'workflow_dispatch' }}"
        uses: actions/upload-artifact@v4
        with:
          name: AM-A«»M-app-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload Release APK Artifact
        if: "${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}"
        uses: actions/upload-artifact@v4
        with:
          name: AM-A«»M-app-release-unsigned
          path: |
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
