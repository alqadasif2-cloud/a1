name: Build Android APK (A«»M)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

permissions:
  contents: write

jobs:
  build-apk:
    name: 📱 Build A«»M Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🟢 Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK & Accept Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: 📦 Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 🌐 Build Vite Web Assets
        run: |
          npm run build

      - name: 🔄 Ensure Android Platform & Gradle Wrapper
        run: |
          # 1. If android folder does not exist in repository, create it automatically
          if [ ! -d "android" ]; then
            echo "⚡ android/ directory not found in repository. Initializing Capacitor Android platform on the fly..."
            npx cap add android
          else
            echo "⚡ android/ directory found. Syncing web assets and plugins..."
            npx cap sync android
          fi

          # 2. Ensure sdk.dir is defined in local.properties
          if [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          elif [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          fi

          # 3. Ensure gradlew has executable permissions
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          else
            echo "⚡ gradlew not found after sync. Forcing capacitor add android..."
            npx cap add android || true
            chmod +x android/gradlew || true
          fi

          # 4. Ensure camera, microphone and media permissions in AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "RECORD_AUDIO" "$MANIFEST"; then
            echo "Injecting media and call permissions into AndroidManifest.xml..."
            sed -i '/<\/application>/a \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST"
          fi

      - name: 🔨 Build Android Debug APK
        if: "${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name != 'workflow_dispatch' }}"
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 🔨 Build Android Release APK (Unsigned)
        if: "${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}"
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: 📤 Upload Debug APK Artifact
        if: "${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name != 'workflow_dispatch' }}"
        uses: actions/upload-artifact@v4
        with:
          name: AM-A«»M-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload Release APK Artifact
        if: "${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}"
        uses: actions/upload-artifact@v4
        with:
          name: AM-A«»M-app-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
          retention-days: 30
